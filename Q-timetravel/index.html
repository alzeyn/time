<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q-timetravel</title>

  <!-- Библиотека Pannellum для 360°-панорам -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Стартовый экран -->
  <div id="start-screen" class="screen">
    <h1>Q-timetravel</h1>
    <button onclick="start()">Начать</button>
  </div>

  <!-- Экран панорамы -->
  <div id="game-screen" hidden>
    <div id="panorama"></div>

    <!-- Нижняя панель с ползунком -->
    <div id="year-bar">
      <span id="year-value">1650</span>
      <input id="year-slider" type="range" min="1400" max="1900" value="1650" oninput="showYear()">
      <button id="check-button" onclick="check()">Проверить</button>
    </div>

    <!-- Информационное окно -->
    <div id="info-panel" hidden>
      <button id="close-button" onclick="closeInfo()">×</button>
      <div id="info"></div>
      <button id="next-button" onclick="next()">Следующее событие</button>
    </div>
  </div>

  <!-- Экран завершения -->
  <div id="finish-screen" class="screen" hidden>
    <h1>Исследование завершено</h1>
    <button onclick="start()">Начать заново</button>
    <button onclick="location.reload()">На главную</button>
  </div>

  <script src="events.js"></script>
  <script src="script.js"></script>
</body>
</html>
